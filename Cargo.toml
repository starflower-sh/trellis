[package]
name = "trellis"
version = "0.1.0"
edition = "2024"

[dependencies]
postgresql_embedded = "0.20.2"
tokio = { version = "1.53.1", features = ["full"] }
sqlx = { version = "0.8.6", features = ["runtime-tokio", "postgres"] }
dotenv = "0.15.0"
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = "1.3.0"
