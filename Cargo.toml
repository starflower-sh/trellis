[package]
name = "pg-trellis"
version = "0.1.0"
authors = ["Charlie Eeles <charlie@starflower.sh>"]
edition = "2024"
license = "Apache-2.0"
description = "Tool to easily configure and run Postgres servers"
repository = "https://github.com/starflower-sh/trellis"

[[bin]]
name = "trellis"
path = "src/main.rs"

[dependencies]
postgresql_embedded = "0.20.2"
tokio = { version = "1.53.1", features = ["full"] }
sqlx = { version = "0.8.6", features = ["runtime-tokio", "postgres"] }
dotenv = "0.15.0"
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = "1.3.0"
colored = "3.1.1"
clap = { version = "4.5.59", features = ["derive"] }
chrono = "0.4.45"
subst = "0.3.8"
