version: "*"

config:
  - key: shared_preload_libraries
    value: "pg_stat_statements,auto_explain"

superuser:
  name: postgres
  password: ${SUPERUSER_PASSWORD:example}

roles:
  - name: charlie
    password: ${CHARLIE_PASSWORD:example}
    login: true

  - name: bridget
    password: ${BRIDGET_PASSWORD:example}
    login: true

  - name: developer
    password: ${DEVELOPER_PASSWORD:example}
    login: false

role_groups:
  - role: developer
    members:
      - charlie
      - bridget

databases:
  - name: sample_db
    owner: charlie
    schema_dump_file: "./schema_dump.sql"
    migrations_dir: "./migrations"
    extensions:
      - pg_stat_statements
      - pg_buffercache
    schemas:
      - name: accounts
        owner: charlie
        privileges:
          usage:
            - developer
          create:
            - developer

